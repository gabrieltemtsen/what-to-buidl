<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What to Buidl Explorer</title>
  <style>
    body { font-family: Inter, system-ui, Arial, sans-serif; margin: 0; background:#0b1020; color:#e9edf6; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .card { background:#131a31; border:1px solid #243055; border-radius:12px; padding:16px; margin:12px 0; }
    input, select { background:#0f1530; color:#fff; border:1px solid #33406b; border-radius:8px; padding:10px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .muted { color:#9eb0df; font-size:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🚀 What to Buidl — Project Explorer</h1>
    <p class="muted">Inspiration ideas for vibe coding + hackathons. <span id="count"></span></p>

    <div class="row">
      <input id="q" placeholder="Search by title, stack, description..." style="min-width:320px;flex:1" />
      <select id="track"><option value="">All tracks</option></select>
      <select id="difficulty"><option value="">All levels</option></select>
    </div>

    <div id="list"></div>
  </div>

  <script>
    let ideas = [];
    const list = document.getElementById('list');
    const count = document.getElementById('count');
    const q = document.getElementById('q');
    const track = document.getElementById('track');
    const difficulty = document.getElementById('difficulty');

    function render() {
      const text = q.value.toLowerCase();
      const t = track.value;
      const d = difficulty.value;
      const filtered = ideas.filter(i => {
        const hay = `${i.title} ${i.description} ${i.suggested_stack} ${i.track}`.toLowerCase();
        return (!text || hay.includes(text)) && (!t || i.track === t) && (!d || i.difficulty === d);
      });
      count.textContent = `${filtered.length} / ${ideas.length} ideas`;
      list.innerHTML = filtered.slice(0, 300).map(i => `
        <div class="card">
          <h3>${i.id}. ${i.title}</h3>
          <p>${i.description}</p>
          <p class="muted"><b>Why now:</b> ${i.why_now}</p>
          <p class="muted"><b>Stack:</b> ${i.suggested_stack} · <b>Track:</b> ${i.track} · <b>Level:</b> ${i.difficulty} · <b>ETA:</b> ${i.time_estimate}</p>
        </div>
      `).join('');
    }

    fetch('./data/ideas.json').then(r => r.json()).then(data => {
      ideas = data;
      const tracks = [...new Set(ideas.map(i => i.track))];
      const levels = [...new Set(ideas.map(i => i.difficulty))];
      tracks.forEach(t => track.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`));
      levels.forEach(l => difficulty.insertAdjacentHTML('beforeend', `<option value="${l}">${l}</option>`));
      render();
    });

    [q, track, difficulty].forEach(el => el.addEventListener('input', render));
  </script>
</body>
</html>
